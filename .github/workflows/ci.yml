name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    name: Validate package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install (no runtime deps)
        run: npm install --no-audit --no-fund

      - name: Syntax-check JS sources
        run: node --check src/host.js && node --check src/client.js

      - name: Validate package.json
        run: node -e "const p=require('./package.json'); ['name','version','license','main'].forEach(k=>{if(!p[k])throw new Error('missing '+k)}); console.log('package.json OK')"
