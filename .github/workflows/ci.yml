name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    name: Validate bundle
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install (no runtime dependencies)
        run: npm install --no-audit --no-fund

      - name: Syntax-check both halves
        run: node --check index.js && node --check client.js

      - name: Run the test suite
        run: npm test

      - name: Validate the bundle manifest and patch
        run: |
          node -e "
          const p = require('./package.json');
          for (const key of ['name', 'version', 'license', 'exports', 'dsh']) {
            if (!p[key]) throw new Error('package.json is missing ' + key);
          }
          if (p.dsh.bundle.patch !== './cordis.patch.yml') throw new Error('dsh.bundle.patch must point at cordis.patch.yml');
          if (!p.dsh.client || p.dsh.client.platform !== 'web') throw new Error('dsh.client.platform must be web');
          for (const target of [p.dsh.bundle.patch, p.dsh.client ? './client.js' : undefined]) {
            if (target !== undefined && !require('node:fs').existsSync(target)) throw new Error('missing ' + target);
          }
          const locale = require('./locale/en.json');
          if (!locale.meta || !locale.meta.title || !locale.meta.description) throw new Error('locale/en.json needs meta.title and meta.description');
          console.log('bundle manifest OK');
          "
